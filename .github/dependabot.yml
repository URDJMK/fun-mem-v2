# Weekly pull requests for outdated or vulnerable dependencies. Minor and patch updates
# come grouped in one pull request; a major update comes alone, to be read on its own.
version: 2
updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
