# The checks every pull request and every push to main must pass: the same ones `just check`
# runs locally, plus a secret scan of the whole history.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: pnpm/action-setup@v6 # the version comes from package.json's packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scan (whole history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start Supabase (database, auth, gateway, REST)
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector
        env:
          # config.toml reads these; no test signs in with Google
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: not-used-in-ci
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: not-used-in-ci

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
