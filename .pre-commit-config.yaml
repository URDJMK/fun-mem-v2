# Git hooks, run by pre-commit (https://pre-commit.com). Once per clone: `just setup`.
#
# Both hooks use tools installed on the machine (gitleaks), so nothing is downloaded and
# they work offline. CI runs the same checks, so a hook skipped with --no-verify is still
# caught there.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets in staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: conventional-commit
        name: commit message follows Conventional Commits
        # run through sh, not the script's #!/bin/sh: pre-commit on Windows reads a shebang as
        # a literal path, and there is no /bin/sh there
        entry: sh scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
